  var SUPPORTED = ['es', 'ca', 'fr', 'en', 'pt'];

  function applyLang(lang) {
    if (!STRINGS[lang]) lang = 'es';
    document.documentElement.lang = lang;
    document.title = STRINGS[lang].h1;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      if (STRINGS[lang][key] != null) el.innerHTML = STRINGS[lang][key];
    });
    document.querySelectorAll('[data-lang-btn]').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-lang-btn') === lang);
    });
    try {
      localStorage.setItem('lang', lang);
    } catch (e) {}
  }

  var saved = null;
  try {
    saved = localStorage.getItem('lang');
  } catch (e) {}
  var browserLang = ((navigator.language || 'es').slice(0, 2) || 'es').toLowerCase();
  var initial = SUPPORTED.indexOf(saved) !== -1 ? saved : SUPPORTED.indexOf(browserLang) !== -1 ? browserLang : 'es';
  applyLang(initial);

  document.querySelectorAll('[data-lang-btn]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      applyLang(btn.getAttribute('data-lang-btn'));
    });
  });
</script>
